# ============================================================
# project.conf — Project Preference Layer
# ============================================================
# This file is the preference layer under the Law.
# It sits between the constitutional layer (.init/ units) and
# session behavior. Claude reads this at session start and
# respects it throughout the session.
#
# TIER STRUCTURE:
#   Tier 1: Constitutional (.init/law.N)     — never edit
#   Tier 2: Project config  (this file)      — Claude edits freely
#   Tier 3: Session memory  (in-context)     — Claude tracks live
#
# HOW CLAUDE UPDATES THIS FILE:
#   When you state a persistent preference ("always commit after
#   each task", "never auto-push", "remember to always X"):
#     law-manage.py prefs set <section>.<key> <value>
#
#   Session-only preferences ("for this task, skip the push")
#   are tracked in memory only — never written here.
#
# WHAT THIS FILE CANNOT DO:
#   Override constitutional Laws. Preferences configure HOW laws
#   are applied. They cannot disable a Law's requirements.
#   Example: AUTO_PUSH=false does not remove the accretion
#   obligation. LAW 26 Obligation 3 is still constitutional.
#
# PROJECT-SPECIFIC EXTENSIONS:
#   Drop-in files in .claude/.init/law.N.d/ extend specific
#   law behaviors. See .claude/prefs.d/ for examples.
#
# ============================================================

# ── [git] ────────────────────────────────────────────────────
# Controls commit and push behavior throughout a session.
# These are the most commonly stated user preferences.
# ─────────────────────────────────────────────────────────────

[git]

# Commit automatically after every completed task.
# When true: Claude commits after marking a task done, without
# waiting for the user to say "commit".
# When false: Claude completes the task and reports; user decides
# when to commit.
# Default: false
# Set via: law-manage.py prefs set git.COMMIT_ON_TASK_COMPLETE true
COMMIT_ON_TASK_COMPLETE = false

# Push automatically after committing.
# When true: every commit is followed immediately by git push.
# When false: commits accumulate locally; push only when user asks.
# Default: false
# Set via: law-manage.py prefs set git.AUTO_PUSH false
AUTO_PUSH = false

# The default branch for this project.
# Used when Claude needs to reference or checkout the main branch.
# Default: main
DEFAULT_BRANCH = main

# Sign commits with GPG.
# When true: all Claude commits use -S flag.
# Default: false
SIGN_COMMITS = false

# Commit message scope prefix (optional).
# When set, prepends to all Claude-generated commit messages.
# Example: "apple-sre" → "apple-sre: Add envs.sh Mosaic enrichment"
# Default: (empty — no prefix)
COMMIT_MSG_SCOPE =


# ── [cascade] ────────────────────────────────────────────────
# Extends the LAW 26 cascade chain for this project.
# These settings add to the chain — they never replace it.
# ─────────────────────────────────────────────────────────────

[cascade]

# Extra cascade targets appended after the standard chain.
# Space-separated list of file paths relative to repo root.
# Example: EXTRA_TARGETS = docs/custom.md docs/api-status.md
# Default: (empty)
EXTRA_TARGETS =

# Prompt before starting the cascade (verbose mode).
# When true: Claude announces "Starting cascade from X" before
# propagating. Useful for large projects with long chains.
# Default: false
VERBOSE = false

# Confirm each cascade step before executing.
# When true: Claude asks "Update docs/project.md?" at each step.
# When false: cascade runs silently end-to-end.
# Constitutional note: You may slow the cascade but not skip it.
# Default: false
CONFIRM_EACH_STEP = false


# ── [ladder] ─────────────────────────────────────────────────
# Extends the LAW 27 Session Coherence Ladder.
# Extra rungs run after the standard 10.
# ─────────────────────────────────────────────────────────────

[ladder]

# Additional project-specific rungs to run at session start.
# Semicolon-separated descriptions of checks to perform.
# Example: EXTRA_RUNGS = Verify all tools in README have a tools/ dir; Check no doc exceeds 500 lines without a section break
# Default: (empty)
EXTRA_RUNGS =

# Rungs to run in report-only mode (flag but do not auto-fix).
# Comma-separated rung numbers (1-10).
# Example: REPORT_ONLY_RUNGS = 1,7  (report nav/TOC issues; don't auto-fix)
# Default: (empty — all auto-fixable rungs auto-fix)
REPORT_ONLY_RUNGS =

# Rungs to skip entirely for this project.
# Constitutional note: You may not skip Rung 4 (Accretion Log)
# or Rung 8 (Constitutional Integrity) — those are constitutional,
# not configurable. All others can be skipped if the project
# has a documented reason.
# Comma-separated rung numbers.
# Default: (empty — run all 10)
SKIP_RUNGS =

# State Report output format.
# full:    All 10 rungs + active prefs header + summary line
# summary: Only FAIL/FIXED items + summary line (default)
# silent:  Summary line only ("Ground is solid" or "N items")
# Default: summary
STATE_REPORT_MODE = summary


# ── [session] ────────────────────────────────────────────────
# Controls session-level behavior visible to the user.
# ─────────────────────────────────────────────────────────────

[session]

# Update MEMORY.md automatically at session end.
# When true: Claude updates MEMORY.md without being asked.
# When false: Claude reports what changed; user decides to update.
# Default: true
AUTO_MEMORY_UPDATE = true

# Announce active preferences at session start.
# When true: "Active prefs: COMMIT_ON_TASK_COMPLETE=true ..." is
# shown as part of the State Report header.
# Default: true
SHOW_PREFS_IN_STATE_REPORT = true

# Show recent commit history at the start of each session.
# When true: the last N commits (date, committer, summary) are printed
# once at session start, before any work begins. Injected into Claude's
# context so Claude knows what was recently done.
# Only fires once per session window (~4 hours) — not on every prompt.
# Default: false
# Set via: law-manage.py prefs set session.SHOW_RECENT_COMMITS true
SHOW_RECENT_COMMITS = false

# How many recent commits to show when SHOW_RECENT_COMMITS is true.
# Default: 10
SHOW_RECENT_COMMITS_COUNT = 10

# Language/tone for Claude's output in this project.
# Options: formal | casual | technical | terse
# Default: (empty — inherit from Claude's defaults)
OUTPUT_TONE =
