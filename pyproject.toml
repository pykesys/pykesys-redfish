[project]
name = "pykesys-redfish"
version = "0.1.0"
description = "Python SDK, CLI, and fleet automation for the Redfish BMC management API"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Daniel Gutierrez" }]
license = { text = "MIT" }

dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "respx>=0.21",
    "requests>=2.32",
]

[project.scripts]
rf = "pykesys_redfish.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pykesys_redfish"]

[tool.pytest.ini_options]
addopts = "--cov=pykesys_redfish --cov-report=term-missing"
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://pypi.apple.com/simple"
default = true
